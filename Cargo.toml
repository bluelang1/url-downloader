[package]
name = "url_downloader"
version = "0.3.2"
edition = "2021"
description = "Paste URLs, pick a folder, download them all. Segmented and resumable downloads with a small egui GUI."
license = "MIT"
repository = "https://github.com/bluelang1/url-downloader"
readme = "README.md"
keywords = ["downloader", "gui", "egui", "macos"]
categories = ["gui", "network-programming"]

[dependencies]
eframe = "0.29"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking"] }
percent-encoding = "2"
serde_json = "1"

[profile.release]
opt-level = 3
strip = true

name: Release
# 태그 vX.Y.Z 를 푸시하면 빌드 → 서명 → 앱 코드로 검증 → 게시까지 한다 (build → sign → verify → publish).
#
# 권한 분리 원칙 (작업마다 셋 중 하나만 가진다):
#   - 시크릿(서명 키)을 읽는 작업(sign)은 쓰기 토큰이 없고, 리포 코드를 체크아웃·실행하지 않는다.
#   - 쓰기 토큰(contents: write)을 가진 작업(publish)은 시크릿이 없고, 리포 코드를 체크아웃·실행하지 않는다.
#   - 리포 코드(cargo, bundle.sh)를 실행하는 작업(build, verify)은 시크릿도 쓰기 토큰도 없다.
# 작업 사이에 넘기는 것은 artifact(release-zip, release-sig) 뿐이다.
#
# 필요한 설정 (scripts/setup-release-env.sh 가 안내하며 만든다):
#   - 환경 `release`: 배포 가능한 ref 를 태그 패턴 `v*` 로만 제한 (브랜치에서는 서명 작업이 돌지 않게)
#   - 환경 `release` 의 시크릿 `MINISIGN_KEY`(minisign 비밀키 파일 내용 전체), `MINISIGN_PASSWORD`(그 비밀키 비밀번호)
#   - 예비 키는 같은 환경의 `MINISIGN_SPARE_KEY`·`MINISIGN_SPARE_PASSWORD` 에 둔다 (이 워크플로는 쓰지 않음. 주 키 시크릿이 망가졌을 때 교체용)
# 비상시(CI 를 쓸 수 없을 때)에는 scripts/release.sh 로 개발자 컴퓨터에서 빌드·서명·게시한다.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# 같은 태그의 실행이 겹치지 않게 한다 (진행 중인 실행은 취소하지 않고 다음 실행이 기다린다)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # 리포 코드 실행: 시크릿 없음, 읽기 권한만
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # 태그는 vX.Y.Z 만 (사전 릴리스 태그는 앱의 버전 비교가 정식 버전과 구분하지 못한다)
      - name: Check tag matches Cargo.toml version
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "tag ${GITHUB_REF_NAME} is not vX.Y.Z"; exit 1; }
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$V"; exit 1; }
      # 알려진 취약점이 있는 의존성으로는 릴리스하지 않는다. 예외는 사유와 함께 .cargo/audit.toml 에만 둔다
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          cargo audit
      # UPDATE_PUBLIC_KEYS 가 비었거나 하나뿐이거나 읽을 수 없으면 실패 (서명해도 앱이 설치하지 못하는 릴리스 방지).
      # 테스트 이름을 정확히 지정하고, 실제로 1개가 통과했는지까지 확인한다 (필터가 틀려 0개 실행으로 통과하는 것 방지)
      - name: Check update signing keys are configured
        run: |
          cargo test --locked -- --ignored --exact security_tests::release_keys_are_configured > release-keys-test.txt 2>&1 \
            || { cat release-keys-test.txt; exit 1; }
          cat release-keys-test.txt
          grep -Eq '^test result: ok\. 1 passed;' release-keys-test.txt \
            || { echo "release_keys_are_configured did not run (expected 1 passed)"; exit 1; }
      - run: cargo test --locked
      - name: Build universal bundle
        run: UNIVERSAL=1 INSTALL=0 ./bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/URL-Downloader-${{ github.ref_name }}-macos-universal.zip
          if-no-files-found: error
          retention-days: 1

  # 시크릿 사용: 쓰기 토큰 없음, 체크아웃 없음 (리포 코드를 실행하지 않는다)
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist
      - name: Check artifact
        run: |
          NAME="URL-Downloader-${GITHUB_REF_NAME}-macos-universal.zip"
          set -- dist/*
          if [ "$#" -ne 1 ] || [ "$1" != "dist/$NAME" ] || [ ! -f "$1" ]; then
            echo "expected exactly one file dist/$NAME, got: $*"
            exit 1
          fi
          ls -l "dist/$NAME"
          sha256sum "dist/$NAME"
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          dpkg-query -W minisign
          minisign -v
      # 시크릿은 env 로만 받는다 (명령줄 인자·로그에 나오지 않게). 비밀키는 umask 077 로 작업 임시 폴더에 쓰고 곧바로 지운다.
      # 비밀번호는 표준입력으로 넘긴다: minisign 은 표준입력이 터미널이 아니어도 한 줄을 읽는다 (0.11·0.12 의 get_password → fgets(stdin)).
      # printf 는 bash 내장이라 비밀번호가 프로세스 인자에 나타나지 않는다.
      # trusted comment 는 서명에 포함되어 위조할 수 없다. 앱은 이 값이 받은 파일명과 같은지 확인한다
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${MINISIGN_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::secret MINISIGN_KEY or MINISIGN_PASSWORD is empty (set both in environment 'release': scripts/setup-release-env.sh)"
            exit 1
          fi
          NAME="URL-Downloader-${GITHUB_REF_NAME}-macos-universal.zip"
          KEY_FILE="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$MINISIGN_KEY" > "$KEY_FILE"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_FILE" -t "file:$NAME" -m "dist/$NAME"
          rm -f "$KEY_FILE"
          ls -l "dist/$NAME.minisig"
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sig
          path: dist/URL-Downloader-${{ github.ref_name }}-macos-universal.zip.minisig
          if-no-files-found: error
          retention-days: 1

  # 리포 코드 실행: 시크릿 없음, 읽기 권한만. 태그 소스의 앱 코드와 앱에 박힌 공개키(UPDATE_PUBLIC_KEYS)로 실제 검증한다
  verify:
    needs: [build, sign]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sig
          path: ${{ runner.temp }}/release
      # 서명 키·trusted comment·파일명·태그 버전·크기 상한을 앱이 설치할 때와 같은 함수로 확인하고, 1개가 실제로 통과했는지까지 본다
      - name: Verify release artifact with app code
        run: |
          ZIP="$RUNNER_TEMP/release/URL-Downloader-${GITHUB_REF_NAME}-macos-universal.zip"
          ls -l "$RUNNER_TEMP/release"
          URL_DOWNLOADER_VERIFY_ZIP="$ZIP" cargo test --locked -- --ignored --exact security_tests::release_artifact_verifies > verify-test.txt 2>&1 \
            || { cat verify-test.txt; exit 1; }
          cat verify-test.txt
          grep -Eq '^test result: ok\. 1 passed;' verify-test.txt \
            || { echo "release_artifact_verifies did not run (expected 1 passed)"; exit 1; }

  # 쓰기 토큰 사용: 시크릿 없음, 체크아웃 없음 (리포 코드를 실행하지 않는다)
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sig
          path: dist
      # 초안으로 만들고 두 파일이 다 올라간 것을 확인한 뒤 공개한다 (zip 만 있고 서명이 없는 상태를 사용자가 보지 않게).
      # 같은 태그의 릴리스(초안 포함)가 이미 있으면 멈춘다. gh release view 는 초안을 최근 것만 찾으므로 목록 전체에서 찾는다
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          NAME="URL-Downloader-$TAG-macos-universal.zip"
          ZIP="dist/$NAME"
          [ -f "$ZIP" ] && [ -f "$ZIP.minisig" ] || { echo "missing $ZIP or $ZIP.minisig"; ls -l dist; exit 1; }
          STATE=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")
          if [ -n "$STATE" ]; then
            echo "::error::release $TAG already exists ($STATE). Delete it on GitHub before re-running"
            exit 1
          fi
          gh release create "$TAG" "$ZIP" "$ZIP.minisig" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes --draft
          ZIP_SIZE=$(wc -c < "$ZIP" | tr -d ' ')
          SIG_SIZE=$(wc -c < "$ZIP.minisig" | tr -d ' ')
          ASSETS=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft) | .assets[] | \"\\(.name) \\(.size) \\(.state)\"")
          printf '%s\n' "$ASSETS"
          printf '%s\n' "$ASSETS" | grep -Fxq "$NAME $ZIP_SIZE uploaded" \
            || { echo "::error::$NAME was not uploaded to the draft release"; exit 1; }
          printf '%s\n' "$ASSETS" | grep -Fxq "$NAME.minisig $SIG_SIZE uploaded" \
            || { echo "::error::$NAME.minisig was not uploaded to the draft release"; exit 1; }
          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "published: $TAG ($NAME, $NAME.minisig)"

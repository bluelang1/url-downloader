name: Release
# 태그에서 검증만 한다 (테스트·서명 키 설정·universal 번들 빌드). 아무것도 게시하지 않는다.
# 릴리스 zip 은 개발자 컴퓨터에서 scripts/release.sh 가 태그 소스로 직접 빌드·서명해 릴리스를 만든다.
# 그래서 이 워크플로(와 GitHub 토큰)가 바뀌어도 서명된 업데이트를 만들 수 없다
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check tag matches Cargo.toml version
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$V"; exit 1; }
      # UPDATE_PUBLIC_KEYS 가 비었거나 하나뿐이거나 읽을 수 없으면 실패 (서명해도 앱이 설치하지 못하는 릴리스 방지)
      - name: Check update signing keys are configured
        run: cargo test --locked release_keys_are_configured -- --ignored
      - run: cargo test --locked
      - name: Check universal bundle builds
        run: UNIVERSAL=1 INSTALL=0 ./bundle.sh

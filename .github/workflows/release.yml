name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  # 테스트·번들까지는 읽기 권한만으로 한다
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check tag matches Cargo.toml version
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v$V"; exit 1; }
      - run: cargo test --locked
      - run: UNIVERSAL=1 INSTALL=0 ./bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1
  # 쓰기 권한은 릴리스 생성에만. 리포 코드는 체크아웃하지 않는다
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist
      - name: Create GitHub release with .app zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
